<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        color: salmon;
        height: 90px;
        width: 90px;
        translate: 0 0;
        background-color: salmon;
        transition: background-color 3s, height 3s, width 3s, transform 3.4s , font-size 3.4s, color 3.4s;
    }
    div:active{
        background-color: indigo;
        height: 700px;
        width: 700px;
        transform: rotate(360deg);
        color: white;
        font-size: 50px;
    }
</style>
<body>
    <div>
        <div>Time for the Magic</div>
    </div>
</body>
</html>
