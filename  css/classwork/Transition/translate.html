<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div{
        width: 200px;
        height: 200px;
        background-color: rgb(244, 0, 97);
        transition: width 2s, background-color 2s, transform 5s , border-radius 5s ,translate 4s;
    }

    div:hover{
        transform: translate(800px,800px) rotate(100deg);
        transform: rotate(100deg);
        background-color:greenyellow;
        height: 500px;
        width: 500px;
        border-radius: 50%;
        translate: 300px 300px;
    }
</style>
<body>
    <div></div>
</body>
</html>
