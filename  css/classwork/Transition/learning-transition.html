<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            background-color: rgb(24, 231, 193);
            transition: width 2s , background-color 2s, height 2s ;
            /* transition-delay: 0.8s; */
        }
        /* #div4:hover{
            height: 200px;
            background-color: rgb(193, 36, 88);
        } */

        div:hover{
            width: 400px;
            background-color: rgb(131, 48, 104);
        }
        
      
        #div1{transition-timing-function: linear;}
        #div2{transition-timing-function: ease-in;}
        #div3{transition-timing-function: ease-out;}
        #div4{transition-timing-function: ease-in-out;}
        #div5{transition-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);}


    </style>
</head>
<body>
    <div id="div1"></div><br>
    <div id="div2"></div><br>
    <div id="div3"></div><br>
    <div id="div4"></div><br>
    <div id="div5"></div><br>
    
</body>
</html>
