<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            position: relative;
            height: 600px;
            width: 600px;
            background-color: #e2d46f;
        }
        .top-left{
            position: absolute;
            left: 0;
            font-weight: bolder;
        }
        .top-right{
            position: absolute;
            right: 0;
            font-weight: bolder;
        }
        .bottom-left{
            position: absolute;
            bottom: 0;
            left: 0;
            font-weight: bolder;
        }
        .bottom-right{
            position: absolute;
            bottom: 0;
            right: 0;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="top-left">Shreya</div>
        <div class="top-right">Shreya</div>
        <div class="bottom-left">Shreya</div>
        <div class="bottom-right">Shreya</div>
    </div>
</body>
</html>
