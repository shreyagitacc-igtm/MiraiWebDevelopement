<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            position: relative;
            background-color: pink;
            height: 700px;
            width: 1000px;
        }
        div div{
            font-weight: bolder;
        }
        .top{
            position: absolute;
            right: 50%;
        }
        .middle-left{
            position: absolute;
            top: 50%;
        }
        .middle-right{
            position: absolute;
            top: 50%;
            right: 0;
        }
        .bottom{
            position: absolute;
            bottom: 0;
            right: 50%;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="top">SHREYA</div>
        <div class="middle-left">SHREYA</div>
        <div class="middle-right">SHREYA</div>
        <div class="bottom">SHREYA</div>
    </div>
    
</body>
</html>
