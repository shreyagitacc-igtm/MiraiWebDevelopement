<!DOCTYPE html>
<html>
<head>
<style>
img {
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
  
}
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="https://www.w3schools.com/css/img_tree.png" alt="Bird sitting on a tree">
<p>Because the image of tree has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
